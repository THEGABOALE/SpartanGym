name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Java 21 · Maven
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spartangym_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d spartangym_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/spartangym_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: VGhpc0lzQVRlc3RPbmx5S2V5Rm9yQ0lSZWNyZXROb3RQcm9kdWN0aW9uMjAyNg==
      ATTENDANCE_QR_SECRET: ci-only-attendance-secret-not-for-production
      APP_QR_SESSION_STORE: memory
    defaults:
      run:
        working-directory: SpartanGymAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SpartanGymAPI/pom.xml
      - name: Initialize schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../spartan_gym_schema.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spartangym_db
      - name: Run API tests
        run: ./mvnw -B --no-transfer-progress verify

  web:
    name: Web · Node 22 · ESLint and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpartanGymWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SpartanGymWeb/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  android:
    name: Android · JDK 21 · Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpartanGymApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            SpartanGymApp/**/*.gradle.kts
            SpartanGymApp/gradle/libs.versions.toml
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
